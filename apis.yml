name: Ray Browser
description: >-
  Ray Browser is an AI-powered web browser that learns a user's interests and
  browsing habits to personalize their internet experience. It ships a built-in
  agent that can run web searches and automate tasks, a curated daily Discover
  feed, and Ray Studio for building custom tools and dashboards without writing
  code. The product is currently in public beta with a free Starter plan that
  grants weekly credits for its AI features. Ray Browser is a consumer product;
  as of this profile it does not publish a public developer API, SDKs, or
  developer documentation. It was surfaced as a portfolio company of a16z and
  added to the API Evangelist network for tracking and enrichment.
